              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1565C0" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M34,26h40a4,4 0,0 1,4 4v52l-8,-6 -8,6 -8,-6 -8,6 -8,-6 -8,6v-52a4,4 0,0 1,4 -4z" />
              <path android:fillColor="#1565C0" android:pathData="M40,40h28v5h-28zM40,52h28v5h-28zM40,64h18v5h-18z" />
          </vector>
          PROJECT_EOF

          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'PROJECT_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PROJECT_EOF

          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'PROJECT_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          PROJECT_EOF

          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'PROJECT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ExpenseLog"
          include ':app'
          PROJECT_EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: app-src
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../ExpenseLog.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseLog-apk
          path: ExpenseLog.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Log build ${{ github.run_number }}
          files: ExpenseLog.apk
