name: Build Expense Log APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the app source files
        run: |
          mkdir -p app-src && cd app-src
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'PROJECT_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.spacecay.expenselog'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.spacecay.expenselog'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }

              // Fixed key so future updates install over the old app and keep your log.
              signingConfigs {
                  debug {
                      storeFile file('expenselog.keystore')
                      storePassword 'expenselog'
                      keyAlias 'expenselog'
                      keyPassword 'expenselog'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              // On-device text reading for receipt screenshots (bundled, works offline).
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          PROJECT_EOF

          mkdir -p "$(dirname 'app/expenselog.keystore')"
