          package com.spacecay.expenselog;

          import android.app.Notification;
          import android.content.pm.ApplicationInfo;
          import android.database.ContentObserver;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import java.util.Locale;

          /** Reads telebirr / CBE notifications and logs each payment. */
          public class PaymentListener extends NotificationListenerService {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable scan = () -> ScreenshotScanner.scanAsync(this, null);
              private ContentObserver observer;

              @Override
              public void onListenerConnected() {
                  super.onListenerConnected();
                  // While notification access is on, Android keeps this service alive,
                  // so it also watches for new screenshots of payment screens.
                  if (observer == null) {
                      observer = new ContentObserver(handler) {
                          @Override
                          public void onChange(boolean selfChange, Uri uri) {
                              handler.removeCallbacks(scan);
                              handler.postDelayed(scan, 2500);
                          }
                      };
                      try {
                          getContentResolver().registerContentObserver(
                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI, true, observer);
                      } catch (Exception ignored) {
                      }
                  }
                  handler.postDelayed(scan, 1000);
              }

              @Override
              public void onListenerDisconnected() {
                  if (observer != null) {
                      try { getContentResolver().unregisterContentObserver(observer); } catch (Exception ignored) { }
                      observer = null;
                  }
                  super.onListenerDisconnected();
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try {
                      handle(sbn);
                  } catch (Exception ignored) {
                  }
              }

              private void handle(StatusBarNotification sbn) {
                  String pkg = sbn.getPackageName();
                  if (pkg == null || pkg.equals(getPackageName())) return;

                  Notification n = sbn.getNotification();
                  if (n == null) return;
                  if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;

                  String source = sourceFor(pkg);
                  if (source == null) return;

                  Bundle ex = n.extras;
                  if (ex == null) return;
                  String title = str(ex.getCharSequence(Notification.EXTRA_TITLE));
                  String text = str(ex.getCharSequence(Notification.EXTRA_BIG_TEXT));
                  if (text.isEmpty()) text = str(ex.getCharSequence(Notification.EXTRA_TEXT));
                  String full = (title + " " + text).trim();
                  if (full.isEmpty() || Parser.isIgnorable(full)) return;

                  Double amount = Parser.amount(text);
                  if (amount == null) amount = Parser.amount(full);
                  if (amount == null) return;

                  long now = System.currentTimeMillis();
                  TxStore store = new TxStore(this);
                  // telebirr often posts two notifications for one payment (e.g. "Airtime" + "Airtime Recharge").
                  if (store.isDuplicate(source, amount, now)) return;

                  String label = title.isEmpty() ? text : title;
                  store.add(new Tx(now, source, label, amount, Parser.isIncoming(full), full));
              }

              private String sourceFor(String pkg) {
                  String p = pkg.toLowerCase(Locale.US);
                  String label = "";
                  try {
                      PackageManager pm = getPackageManager();
                      ApplicationInfo ai = pm.getApplicationInfo(pkg, 0);
                      label = String.valueOf(pm.getApplicationLabel(ai)).toLowerCase(Locale.US);
                  } catch (Exception ignored) {
                  }
                  if (label.contains("telebirr") || p.contains("telebirr") || p.equals("cn.tydic.ethiopay")) {
                      return "telebirr";
                  }
                  if (label.contains("cbe") || label.contains("commercial bank") || p.contains("cbe")
                          || p.contains("combanketh")) {
                      return "CBE";
                  }
                  return null;
              }

              private static String str(CharSequence cs) {
                  return cs == null ? "" : cs.toString().trim();
              }
          }
          PROJECT_EOF

