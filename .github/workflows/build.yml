name: Build Expense Log APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ExpenseLog.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseLog-apk
          path: ExpenseLog.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Log build ${{ github.run_number }}
          files: ExpenseLog.apk
