name: Build Expense Log APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk ExpenseLog.apk

      - name: Save build log on failure
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|Caused by" -A3 build.log | head -300 > errors.txt || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rfq . || true
          cp errors.txt errors.txt.keep 2>/dev/null || true
          mv errors.txt.keep errors.txt
          git add errors.txt
          git commit -qm "Build ${{ github.run_number }} errors"
          git push -f origin build-logs

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseLog-apk
          path: ExpenseLog.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Log build ${{ github.run_number }}
          files: ExpenseLog.apk
