          PROJECT_EOF

          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'PROJECT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ExpenseLog"
          include ':app'
          PROJECT_EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: app-src
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../ExpenseLog.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseLog-apk
          path: ExpenseLog.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Log build ${{ github.run_number }}
          files: ExpenseLog.apk
