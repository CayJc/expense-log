          cat > 'app/src/main/java/com/spacecay/expenselog/ReceiptParser.java' <<'PROJECT_EOF'
          package com.spacecay.expenselog;

          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Turns the text read from a CBE / telebirr success screenshot into a transaction. */
          public class ReceiptParser {

              public static class Line {
                  public final String text;
                  public final int left, top, right, bottom;

                  public Line(String text, int left, int top, int right, int bottom) {
                      this.text = text == null ? "" : text.trim();
                      this.left = left;
                      this.top = top;
                      this.right = right;
                      this.bottom = bottom;
                  }

                  int height() { return Math.max(1, bottom - top); }
                  int centerY() { return (top + bottom) / 2; }
              }

              public static class Result {
                  public String source;
                  public String title;
                  public double amount;
                  public boolean incoming;
                  public String txnId = "";
                  public String raw = "";
              }

              private static final String NUM = "(\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?|\\d+(?:\\.\\d+)?)";
              private static final Pattern CBE_TOTAL = Pattern.compile(
                      "Total\\s+Amount\\s+Debited\\s*:?\\s*(?:ETB)?\\s*" + NUM, Pattern.CASE_INSENSITIVE);
              private static final Pattern CBE_SENT = Pattern.compile(
                      "(?:transferred|paid|sent)\\s+(?:ETB\\s*)?" + NUM, Pattern.CASE_INSENSITIVE);
              private static final Pattern CBE_TO = Pattern.compile(
                      "\\s(?:for|to)\\s+(.+?)\\s+on\\s+[A-Za-z]{3,9}\\.?\\s+\\d{1,2},?\\s+\\d{4}", Pattern.CASE_INSENSITIVE);
              private static final Pattern CBE_ID = Pattern.compile(
                      "Transaction\\s+ID\\s*:?\\s*([A-Z0-9]{6,})", Pattern.CASE_INSENSITIVE);
              private static final Pattern BIG_AMOUNT = Pattern.compile(
                      "^([+-])?\\s*(\\d{1,3}(?:,\\d{3})+\\.\\d{2}|\\d+\\.\\d{2})\\s*(?:\\(?\\s*ETB\\s*\\)?)?$", Pattern.CASE_INSENSITIVE);

              public static Result parse(List<Line> lines, String fileHint) {
                  StringBuilder sb = new StringBuilder();
                  for (Line l : lines) sb.append(l.text).append(' ');
                  String full = sb.toString().replaceAll("\\s+", " ").trim();
                  String low = full.toLowerCase(Locale.US);
                  String hint = fileHint == null ? "" : fileHint.toLowerCase(Locale.US);

                  boolean looksLikeReceipt = low.contains("total amount debited")
                          || (low.contains("transaction") && low.contains("success"));
                  if (!looksLikeReceipt) return null;
                  if (low.contains("failed") || low.contains("unsuccessful")) return null;

                  boolean cbe = low.contains("commercial bank of ethiopia") || low.contains("total amount debited")
                          || hint.contains("cbe");
                  Result r = cbe ? parseCbe(full, low) : parseTelebirr(lines, full, low);
                  if (r == null || r.amount <= 0) return null;
                  r.raw = full.length() > 400 ? full.substring(0, 400) : full;
                  return r;
              }

              private static Result parseCbe(String full, String low) {
                  Result r = new Result();
                  r.source = "CBE";
                  Double amt = firstNum(CBE_TOTAL, full);
                  if (amt == null) amt = firstNum(CBE_SENT, full);
                  if (amt == null) amt = Parser.amount(full);
                  if (amt == null) return null;
                  r.amount = amt;

                  Matcher to = CBE_TO.matcher(full);
                  String who = to.find() ? to.group(1).trim() : "";
                  if (who.length() > 60) who = who.substring(0, 60).trim() + "…";
                  Double sent = firstNum(CBE_SENT, full);
                  String base = low.contains("paid") ? "Payment" : "Transfer";
                  r.title = who.isEmpty() ? "CBE " + base.toLowerCase(Locale.US) : base + " to " + who;
                  if (sent != null && Math.abs(sent - amt) > 0.001) {
                      r.title += " (" + TxStore.money(sent) + " + fees)";
                  }

                  Matcher id = CBE_ID.matcher(full);
                  if (id.find()) r.txnId = id.group(1);
                  r.incoming = (low.contains("credited") || low.contains("received")) && !low.contains("debited");
                  return r;
              }

              private static Result parseTelebirr(List<Line> lines, String full, String low) {
                  Result r = new Result();
                  r.source = "telebirr";

                  Line best = null;
                  String sign = "";
                  for (Line l : lines) {
                      Matcher m = BIG_AMOUNT.matcher(l.text);
                      if (m.find() && (best == null || l.height() > best.height())) {
                          best = l;
                          sign = m.group(1) == null ? "" : m.group(1);
                      }
                  }
                  Double amt = null;
                  if (best != null) {
                      Matcher m = BIG_AMOUNT.matcher(best.text);
                      if (m.find()) amt = Double.parseDouble(m.group(2).replace(",", ""));
                  }
                  if (amt == null) amt = Parser.amount(full);
                  if (amt == null) return null;
                  r.amount = amt;

                  String type = valueRightOf(lines, "Transaction Type");
                  String to = valueRightOf(lines, "Transaction To");
                  r.txnId = valueRightOf(lines, "Transaction Number").replaceAll("\\s+", "");
                  if (r.txnId.isEmpty()) {
                      Matcher m = Pattern.compile("Transaction\\s+(?:Number|No\\.?|ID)\\s*:?\\s*([A-Z0-9]{6,})",
                              Pattern.CASE_INSENSITIVE).matcher(full);
                      if (m.find()) r.txnId = m.group(1);
                  }

                  if (type.isEmpty()) type = lines.isEmpty() ? "" : lines.get(0).text;
                  if (type.isEmpty()) type = "telebirr payment";
                  r.title = to.isEmpty() ? type : type + " → " + to;

                  String tl = type.toLowerCase(Locale.US);
                  r.incoming = "+".equals(sign) || tl.contains("receive") || tl.contains("cash in");
                  return r;
              }

              /** Finds the value printed to the right of a label, e.g. "Transaction Type    Airtime Recharge". */
              static String valueRightOf(List<Line> lines, String label) {
                  String lab = label.toLowerCase(Locale.US);
                  for (Line l : lines) {
                      String t = l.text.toLowerCase(Locale.US);
                      if (!t.startsWith(lab)) continue;
                      String rest = l.text.substring(Math.min(l.text.length(), label.length())).replaceFirst("^[\\s:]+", "");
                      if (!rest.isEmpty()) return rest;
                      Line found = null;
                      for (Line o : lines) {
                          if (o == l || o.left <= l.right - 2) continue;
                          if (Math.abs(o.centerY() - l.centerY()) > l.height() * 0.7) continue;
                          if (found == null || o.left < found.left) found = o;
                      }
                      if (found != null) return found.text;
                  }
                  return "";
              }

              private static Double firstNum(Pattern p, String s) {
                  Matcher m = p.matcher(s);
                  if (!m.find()) return null;
                  try {
                      return Double.parseDouble(m.group(1).replace(",", ""));
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          PROJECT_EOF

          mkdir -p "$(dirname 'app/src/main/java/com/spacecay/expenselog/ScreenshotScanner.java')"
          cat > 'app/src/main/java/com/spacecay/expenselog/ScreenshotScanner.java' <<'PROJECT_EOF'
          package com.spacecay.expenselog;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentUris;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Rect;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;

          import com.google.android.gms.tasks.Tasks;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;

          /** Finds new screenshots of CBE / telebirr success screens and logs them. Everything stays on the phone. */
          public class ScreenshotScanner {
              private static final ExecutorService EXEC = Executors.newSingleThreadExecutor();
              private static final String PREFS = "scanner";
              private static final String CHANNEL = "logged";
              private static TextRecognizer recognizer;

              public interface Done { void run(int added); }

              public static boolean hasPermission(Context ctx) {
                  return ctx.checkSelfPermission(permissionName()) == PackageManager.PERMISSION_GRANTED;
              }

              public static String permissionName() {
                  return Build.VERSION.SDK_INT >= 33 ? Manifest.permission.READ_MEDIA_IMAGES
                          : Manifest.permission.READ_EXTERNAL_STORAGE;
              }

              /** Scan for new screenshots in the background. callback may be null. */
              public static void scanAsync(Context ctx, Done callback) {
                  Context app = ctx.getApplicationContext();
                  EXEC.execute(() -> {
                      int added = 0;
                      try {
                          added = scanNow(app);
                      } catch (Throwable ignored) {
                      }
                      if (callback != null) callback.run(added);
                  });
              }

              /** Read one specific image (shared into the app). */
              public static void readSharedAsync(Context ctx, Uri uri, Done callback) {
                  Context app = ctx.getApplicationContext();
                  EXEC.execute(() -> {
                      int added = 0;
                      try {
                          if (processImage(app, uri, System.currentTimeMillis(), "shared", false)) added = 1;
                      } catch (Throwable ignored) {
                      }
                      if (callback != null) callback.run(added);
                  });
              }

              private static synchronized TextRecognizer recognizer() {
                  if (recognizer == null) recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                  return recognizer;
              }

              private static int scanNow(Context ctx) throws Exception {
                  if (!hasPermission(ctx)) return 0;
                  SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  long since = sp.getLong("since", -1);
                  if (since < 0) {
                      // First run: pick up screenshots from the start of today, not your whole gallery.
                      Calendar c = Calendar.getInstance();
                      c.set(Calendar.HOUR_OF_DAY, 0);
                      c.set(Calendar.MINUTE, 0);
                      c.set(Calendar.SECOND, 0);
                      since = c.getTimeInMillis() / 1000;
                      sp.edit().putLong("since", since).apply();
                  }
                  Set<String> done = new HashSet<>(sp.getStringSet("done", new HashSet<>()));

                  Uri base = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                  List<String> cols = new ArrayList<>();
                  cols.add(MediaStore.Images.Media._ID);
                  cols.add(MediaStore.Images.Media.DATE_ADDED);
                  cols.add(MediaStore.Images.Media.DATE_TAKEN);
                  cols.add(MediaStore.Images.Media.DISPLAY_NAME);
                  cols.add(Build.VERSION.SDK_INT >= 29 ? MediaStore.Images.Media.RELATIVE_PATH
                          : MediaStore.Images.Media.DATA);
                  String sel = MediaStore.Images.Media.DATE_ADDED + " >= ?";
                  if (Build.VERSION.SDK_INT >= 29) sel += " AND " + MediaStore.Images.Media.IS_PENDING + " = 0";

                  int added = 0;
                  long newest = since;
                  try (Cursor cur = ctx.getContentResolver().query(base, cols.toArray(new String[0]), sel,
                          new String[]{String.valueOf(since - 5)}, MediaStore.Images.Media.DATE_ADDED + " ASC")) {
                      if (cur == null) return 0;
                      while (cur.moveToNext()) {
                          long id = cur.getLong(0);
                          long addedSec = cur.getLong(1);
                          long taken = cur.getLong(2);
                          String name = cur.getString(3);
                          String path = cur.getString(4);
                          String hint = ((path == null ? "" : path) + "/" + (name == null ? "" : name));
                          newest = Math.max(newest, addedSec);
                          String key = String.valueOf(id);
                          if (done.contains(key)) continue;
                          if (!looksLikeScreenshot(hint)) { done.add(key); continue; }
                          long when = taken > 0 ? taken : addedSec * 1000L;
                          Uri uri = ContentUris.withAppendedId(base, id);
                          if (processImage(ctx, uri, when, hint, true)) added++;
                          done.add(key);
                      }
                  }
                  if (done.size() > 400) {
                      List<String> l = new ArrayList<>(done);
                      done = new HashSet<>(l.subList(l.size() - 300, l.size()));
                  }
                  sp.edit().putLong("since", newest).putStringSet("done", done).apply();
                  return added;
              }

              private static boolean looksLikeScreenshot(String hint) {
                  String h = hint.toLowerCase(Locale.US);
                  return h.contains("screenshot") || h.contains("cbe") || h.contains("telebirr");
              }

              private static boolean processImage(Context ctx, Uri uri, long when, String hint, boolean notify)
                      throws Exception {
                  InputImage img = InputImage.fromFilePath(ctx, uri);
                  Text text = Tasks.await(recognizer().process(img), 30, TimeUnit.SECONDS);
                  List<ReceiptParser.Line> lines = new ArrayList<>();
                  for (Text.TextBlock b : text.getTextBlocks()) {
                      for (Text.Line l : b.getLines()) {
                          Rect r = l.getBoundingBox();
                          if (r == null) r = new Rect(0, 0, 0, 0);
                          lines.add(new ReceiptParser.Line(l.getText(), r.left, r.top, r.right, r.bottom));
                      }
                  }
                  ReceiptParser.Result res = ReceiptParser.parse(lines, hint);
                  if (res == null) return false;

                  TxStore store = new TxStore(ctx);
                  if (store.hasTxnId(res.txnId)) return false;
                  // Already caught from a telebirr notification around the same time.
                  if (store.isNear(res.source, res.amount, when, 5 * 60 * 1000L)) return false;

                  Tx tx = new Tx(when, res.source, res.title, res.amount, res.incoming, res.raw);
                  tx.txnId = res.txnId;
                  store.add(tx);
                  if (notify) showLogged(ctx, tx);
                  return true;
              }

              private static void showLogged(Context ctx, Tx tx) {
                  try {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(CHANNEL) == null) {
                          nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Logged payments",
                                  NotificationManager.IMPORTANCE_LOW));
                      }
                      Intent open = new Intent(ctx, MainActivity.class);
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, open,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Notification n = new Notification.Builder(ctx, CHANNEL)
                              .setSmallIcon(R.drawable.ic_stat)
                              .setContentTitle("Logged " + TxStore.money(tx.amount) + " ETB · " + tx.source)
                              .setContentText(tx.title)
                              .setContentIntent(pi)
                              .setAutoCancel(true)
                              .build();
                      nm.notify((int) (tx.time % 100000), n);
                  } catch (Throwable ignored) {
                  }
              }
          }
          PROJECT_EOF

          mkdir -p "$(dirname 'app/src/main/java/com/spacecay/expenselog/Tx.java')"
          cat > 'app/src/main/java/com/spacecay/expenselog/Tx.java' <<'PROJECT_EOF'
          package com.spacecay.expenselog;

          public class Tx {
              public long time;
              public String source;
              public String title;
              public double amount;
              public boolean incoming;
              public String raw;
              public String txnId = "";

              public Tx(long time, String source, String title, double amount, boolean incoming, String raw) {
                  this.time = time;
                  this.source = source;
                  this.title = title;
                  this.amount = amount;
                  this.incoming = incoming;
                  this.raw = raw;
              }

              private static String clean(String s) {
                  if (s == null) return "";
                  return s.replace('\t', ' ').replace('\n', ' ').replace('\r', ' ').trim();
              }

              public String toLine() {
                  return time + "\t" + clean(source) + "\t" + clean(title) + "\t" + amount + "\t"
                          + (incoming ? "IN" : "OUT") + "\t" + clean(raw) + "\t" + clean(txnId);
              }

              public static Tx fromLine(String line) {
                  try {
                      String[] p = line.split("\t", -1);
                      if (p.length < 5) return null;
                      Tx t = new Tx(Long.parseLong(p[0]), p[1], p[2], Double.parseDouble(p[3]),
                              "IN".equals(p[4]), p.length > 5 ? p[5] : "");
                      if (p.length > 6) t.txnId = p[6];
                      return t;
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          PROJECT_EOF

          mkdir -p "$(dirname 'app/src/main/java/com/spacecay/expenselog/TxStore.java')"
          cat > 'app/src/main/java/com/spacecay/expenselog/TxStore.java' <<'PROJECT_EOF'
          package com.spacecay.expenselog;

          import android.content.Context;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FileReader;
          import java.io.FileWriter;
          import java.io.OutputStreamWriter;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          /** Stores every transaction as one tab-separated line in a private text file. */
          public class TxStore {
              private static final Object LOCK = new Object();
              private final File file;

              public TxStore(Context ctx) {
                  file = new File(ctx.getFilesDir(), "transactions.tsv");
              }

              public void add(Tx tx) {
                  synchronized (LOCK) {
                      try (OutputStreamWriter w = new OutputStreamWriter(
                              new FileOutputStream(file, true), StandardCharsets.UTF_8)) {
                          w.write(tx.toLine());
                          w.write("\n");
                      } catch (Exception ignored) {
                      }
                  }
              }

              public List<Tx> all() {
                  List<Tx> list = new ArrayList<>();
                  synchronized (LOCK) {
                      if (!file.exists()) return list;
                      try (BufferedReader r = new BufferedReader(new FileReader(file))) {
                          String line;
                          while ((line = r.readLine()) != null) {
                              Tx t = Tx.fromLine(line);
                              if (t != null) list.add(t);
                          }
                      } catch (Exception ignored) {
                      }
                  }
                  return list;
              }

              private void writeAll(List<Tx> list) {
                  try (FileWriter w = new FileWriter(file, false)) {
                      for (Tx t : list) {
                          w.write(t.toLine());
                          w.write("\n");
                      }
                  } catch (Exception ignored) {
                  }
              }

              public void delete(Tx target) {
                  synchronized (LOCK) {
                      List<Tx> list = all();
                      List<Tx> keep = new ArrayList<>();
                      boolean removed = false;
                      for (Tx t : list) {
                          if (!removed && t.time == target.time && t.amount == target.amount
                                  && t.title.equals(target.title)) {
                              removed = true;
                              continue;
                          }
                          keep.add(t);
                      }
                      writeAll(keep);
                  }
              }

              public List<Tx> forDay(Calendar day) {
                  Calendar start = (Calendar) day.clone();
                  start.set(Calendar.HOUR_OF_DAY, 0);
                  start.set(Calendar.MINUTE, 0);
                  start.set(Calendar.SECOND, 0);
                  start.set(Calendar.MILLISECOND, 0);
                  long from = start.getTimeInMillis();
                  start.add(Calendar.DAY_OF_MONTH, 1);
                  long to = start.getTimeInMillis();
                  List<Tx> out = new ArrayList<>();
                  for (Tx t : all()) {
                      if (t.time >= from && t.time < to) out.add(t);
                  }
                  return out;
              }

              /** True if the same amount from the same app was already logged in the last 2 minutes. */
              public boolean isDuplicate(String source, double amount, long now) {
                  List<Tx> list = all();
                  for (int i = list.size() - 1; i >= 0; i--) {
                      Tx t = list.get(i);
                      if (now - t.time > 120000) break;
                      if (t.source.equals(source) && Math.abs(t.amount - amount) < 0.001) return true;
                  }
                  return false;
              }

              /** True if a matching payment is already logged within +/- windowMs of the given time. */
              public boolean isNear(String source, double amount, long time, long windowMs) {
                  for (Tx t : all()) {
                      if (Math.abs(t.time - time) <= windowMs && t.source.equals(source)
                              && Math.abs(t.amount - amount) < 0.001) return true;
                  }
                  return false;
              }

              public boolean hasTxnId(String id) {
                  if (id == null || id.isEmpty()) return false;
                  for (Tx t : all()) if (id.equalsIgnoreCase(t.txnId)) return true;
                  return false;
              }

              public static String money(double v) {
                  return String.format(Locale.US, "%,.2f", v);
              }

              public static String dayReport(Calendar day, List<Tx> list) {
                  SimpleDateFormat dayFmt = new SimpleDateFormat("EEE, d MMM yyyy", Locale.US);
                  SimpleDateFormat timeFmt = new SimpleDateFormat("HH:mm", Locale.US);
                  StringBuilder sb = new StringBuilder();
                  sb.append("Expenses - ").append(dayFmt.format(day.getTime())).append("\n\n");
                  double out = 0, in = 0;
                  for (Tx t : list) {
                      sb.append(timeFmt.format(new Date(t.time))).append("  ")
                              .append(t.source).append("  ")
                              .append(t.incoming ? "+" : "-").append(money(t.amount)).append("  ")
                              .append(t.title).append("\n");
                      if (t.incoming) in += t.amount; else out += t.amount;
                  }
                  if (list.isEmpty()) sb.append("No transactions.\n");
                  sb.append("\nTotal spent: ").append(money(out)).append(" ETB");
                  if (in > 0) sb.append("\nTotal received: ").append(money(in)).append(" ETB");
                  return sb.toString();
              }
          }
          PROJECT_EOF

